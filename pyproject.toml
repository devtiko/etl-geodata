[project]
name = "etl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28.1", "pydantic>=2.14.1"]

[project.scripts]
etl = "etl.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
extraPaths = ["src"]
pythonVersion = "3.12"
reportUnusedCallResult = false
reportAny = false
